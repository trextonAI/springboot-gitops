
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: springboot-demo
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/trextonAI/springboot-gitops.git
    targetRevision: HEAD
    path: apps/springboot-demo

    helm:
      releaseName: springboot-demo

  destination:
    server: https://kubernetes.default.svc
    namespace: springboot-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
