replicaCount: 3

image:
  repository: trexdocker0007/springboot-demo
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

containerPort: 8080

config:
  SPRING_PROFILES_ACTIVE: default
  SERVER_PORT: "8080"

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi
